name: Build Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build.sh"
      - "build.conf"
      - "linconf"
      - "patches/**"
      - ".github/workflows/kernel.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Linux for MIPS
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout distro repository
        uses: actions/checkout@v4

      - name: Build kernel
        run: bash ./build.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: upkernel
          path: upkernel/
          if-no-files-found: error
          retention-days: 14

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: upmods
          path: upmods/
          if-no-files-found: error
          retention-days: 14
