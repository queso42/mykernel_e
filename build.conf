#!/usr/bin/env bash

#forgive me for vibe coding this automated script, i cant make a yaml and dont want to waste time 
# Target Linux kernel architecture
export arch=mips

# Ubuntu cross-compiler prefix
# Installs gcc-mipsel-linux-gnu
export toolarch=mipsel

# Linux kernel release version (no leading v required)
export linux_version=5.10.271

# Kernel build target
export kernel_target=vmlinux

# Kernel files to include in /upkernel
# Paths are relative to the extracted Linux source directory.
export kernel_files="
vmlinux
"
